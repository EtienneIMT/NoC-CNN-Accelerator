name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: docker build -t noc-cnn-accelerator .
      
    - name: Build Baseline Design
      run: docker run --rm noc-cnn-accelerator bash -c "cd src/baseline && make"
      
    - name: Build Optimized Design
      run: docker run --rm noc-cnn-accelerator bash -c "cd src/optimized && make"
